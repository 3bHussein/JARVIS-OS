name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s apps/voice-worker -p test_worker.py
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:launcher
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:e2e
      - run: npm run test:e2e:built
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s apps/voice-worker -p test_worker.py
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Check Windows batch entry points
        shell: cmd
        run: |
          call Setup-JARVIS.bat --help
          call Start-JARVIS.bat --help
          call Start-JARVIS-Built.bat --help
      - run: npm run test:launcher

name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JARVIS_TEST_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s apps/voice-worker -p test_worker.py
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:launcher
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu24-playwright-${{ hashFiles('package-lock.json') }}
      # Hosted Ubuntu already supplies Chrome runtime dependencies. Avoid unrelated apt mirror failures.
      - run: npx playwright install chromium --only-shell
      - run: npm run test:e2e
      - run: npm run test:e2e:built
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s apps/voice-worker -p test_worker.py
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Check Windows batch entry points
        shell: cmd
        run: |
          call Setup-JARVIS.bat --help
          call Start-JARVIS.bat --help
          call Start-JARVIS-Built.bat --help
          call Setup-JARVIS-Preview.bat --help
          call Configure-JARVIS.bat --help
          call 01-Setup-JARVIS.bat --help
          call 02-Start-JARVIS.bat --help
          call 03-Configure-AI-Voice.bat --help
          call 04-Open-Desktop.bat --help
      - run: npm run test:launcher

      - name: Prepare clean personal preview
        run: npm run package:preview
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-OS-Personal-Preview
          path: test-results/JARVIS-OS-Personal-Preview-*
          if-no-files-found: error
          retention-days: 14

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/desktop-icon.mjs
      - name: Select stable Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-jarvis-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.toml') }}
      - name: Require committed native dependency lock
        shell: pwsh
        run: |
          if (!(Test-Path apps/desktop/src-tauri/Cargo.lock)) { throw "Committed Cargo.lock is required" }
      - name: Test native policy and bounded probe
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked
        env:
          JARVIS_SOURCE_SHA: ${{ github.sha }}
      - name: Build native Windows host
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --release --locked
        env:
          JARVIS_SOURCE_SHA: ${{ github.sha }}
      - run: node tests/desktop-smoke.mjs
      - run: node scripts/package-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-OS-Windows-Desktop-Preview
          path: test-results/desktop/JARVIS-OS-Personal-Preview-*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Desktop-Build-Evidence
          path: |
            apps/desktop/src-tauri/Cargo.lock
            test-results/desktop-smoke.json
          if-no-files-found: error
          retention-days: 14
